name: Dashboard aktualisieren

on:
  schedule:
    - cron: "*/30 * * * *"       # alle 30 Minuten
  workflow_dispatch:
  push:
    paths: ["queue.json", "posted.json", "brands/**", "engage/stats.json"]

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Befehle aus dem Dashboard anwenden
        run: node scripts/apply_commands.mjs || true
      - name: State bauen
        run: node scripts/dashboard.mjs
      - name: Zurueckschreiben
        run: |
          git pull --rebase -q || true
          if [[ -n "$(git status --porcelain dashboard/ queue.json)" ]]; then
            git config user.name  "reel-bot"
            git config user.email "reel-bot@users.noreply.github.com"
            git add -A dashboard/ queue.json
            git commit -m "dashboard: $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
