name: Engagement (Kommentare, DMs, Stats)

on:
  schedule:
    - cron: "17 */2 * * *"     # alle 2 h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: engage
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Inbox/Outbox/Stats
        env:
          IG_TOKEN:    ${{ secrets.IG_TOKEN }}
          IG_USER_ID:  ${{ secrets.IG_USER_ID }}
          IG_USERNAME: nurwissen_official
        run: node scripts/engage.mjs
      - name: Zurueckschreiben
        run: |
          git pull --rebase -q || true
          if [[ -n "$(git status --porcelain engage/)" ]]; then
            git config user.name  "reel-bot"
            git config user.email "reel-bot@users.noreply.github.com"
            git add -A engage/
            git commit -m "engage: $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
