name: Story posten

on:
  schedule:
    # GitHub verschiebt geplante Laeufe taeglich um 2-4,5 h. Deshalb weit vor
    # der Zielzeit starten und im Job bis 19:00 UTC = 20:00 Berlin warten.
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen, nicht posten"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auf 20:00 Berlin warten
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(date -u -d "today 19:00" +%s)
          NOW=$(date -u +%s)
          DIFF=$(( TARGET - NOW ))
          echo "Jetzt $(date -u +%H:%M) UTC, Ziel 19:00 UTC, Differenz ${DIFF}s"
          if [ "$DIFF" -gt 21600 ]; then
            echo "Mehr als 6 h zu frueh - dieser Lauf macht nichts."
            exit 0
          fi
          if [ "$DIFF" -gt 0 ]; then
            echo "Warte ${DIFF}s bis 19:00 UTC"
            sleep "$DIFF"
          else
            echo "Zielzeit bereits $(( -DIFF ))s vorbei - sofort posten"
          fi

      - name: ffmpeg bereitstellen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Story veroeffentlichen
        env:
          IG_TOKEN:   ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN:    ${{ inputs.dry_run }}
        run: node scripts/story.mjs

      - name: Queue zurueckschreiben
        run: |
          git pull --rebase -q || true
          if [[ -n "$(git status --porcelain queue.json videos/)" ]]; then
            git config user.name  "reel-bot"
            git config user.email "reel-bot@users.noreply.github.com"
            git add -A queue.json videos/
            git commit -m "story: $(date -u +%Y-%m-%d)"
            git push
          fi
