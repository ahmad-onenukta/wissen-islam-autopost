name: Story posten

on:
  schedule:
    # Frueh starten, dann im Job bis zur Zielzeit warten (GitHub verschiebt
    # geplante Laeufe bei Last). Ziel: 19:00 UTC = 20:00 Berlin, 1 h nach dem Reel.
    - cron: "20 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen, nicht posten"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auf 20:00 Berlin warten
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(date -u -d "today 19:00" +%s)
          NOW=$(date -u +%s)
          DIFF=$(( TARGET - NOW ))
          if [ "$DIFF" -gt 0 ] && [ "$DIFF" -le 3600 ]; then
            echo "Warte ${DIFF}s bis 19:00 UTC"
            sleep "$DIFF"
          else
            echo "Kein Warten noetig (DIFF=${DIFF}s)"
          fi

      - name: ffmpeg bereitstellen
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Story veroeffentlichen
        env:
          IG_TOKEN:   ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN:    ${{ inputs.dry_run }}
        run: node scripts/story.mjs

      - name: Queue zurueckschreiben
        run: |
          if [[ -n "$(git status --porcelain queue.json videos/)" ]]; then
            git config user.name  "reel-bot"
            git config user.email "reel-bot@users.noreply.github.com"
            git add -A queue.json videos/
            git commit -m "story: $(date -u +%Y-%m-%d)"
            git push
          fi
