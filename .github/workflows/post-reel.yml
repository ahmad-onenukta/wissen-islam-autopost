name: Reel posten

on:
  schedule:
    # Frueh starten, dann im Job bis zur Zielzeit warten. GitHub verschiebt
    # geplante Laeufe bei Last um bis zu ~90 Minuten.
    - cron: "20 17 * * *"   # 17:20 UTC, Ziel 18:00 UTC = 19:00 Berlin (Winterzeit)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen, nicht posten"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Auf 19:00 Berlin warten
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(date -u -d "today 18:00" +%s)
          NOW=$(date -u +%s)
          DIFF=$(( TARGET - NOW ))
          if [ "$DIFF" -gt 0 ] && [ "$DIFF" -le 3600 ]; then
            echo "Warte ${DIFF}s bis 18:00 UTC"
            sleep "$DIFF"
          else
            echo "Kein Warten noetig (DIFF=${DIFF}s)"
          fi

      - name: Reel veroeffentlichen
        env:
          IG_TOKEN:   ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN:    ${{ inputs.dry_run }}
        run: node scripts/post.mjs

      - name: Queue zurueckschreiben
        run: |
          if [[ -n "$(git status --porcelain queue.json posted.json videos/)" ]]; then
            git config user.name  "reel-bot"
            git config user.email "reel-bot@users.noreply.github.com"
            git add -A queue.json posted.json videos/
            git commit -m "posted: $(date -u +%Y-%m-%d)"
            git push
          fi
