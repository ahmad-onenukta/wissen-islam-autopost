name: Reel posten

on:
  schedule:
    # GitHub verschiebt geplante Laeufe taeglich um 2-4,5 h. Deshalb starten wir
    # weit vor der Zielzeit und warten im Job bis exakt 18:00 UTC = 19:00 Berlin.
    # WICHTIG: Das Warten steht VOR dem Checkout, sonst arbeitet der Lauf mit
    # einem Stand von vor mehreren Stunden und sieht neue Queue-Eintraege nicht.
    - cron: "0 11 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen, nicht posten"
        type: boolean
        default: false
      youtube_id:
        description: "Nur YouTube-Short fuer diese Queue-ID hochladen"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Auf 19:00 Berlin warten
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(date -u -d "today 18:00" +%s)
          NOW=$(date -u +%s)
          DIFF=$(( TARGET - NOW ))
          echo "Jetzt $(date -u +%H:%M) UTC, Ziel 18:00 UTC, Differenz ${DIFF}s"
          if [ "$DIFF" -gt 21600 ]; then
            echo "Mehr als 6 h zu frueh - dieser Lauf macht nichts."
            exit 0
          fi
          if [ "$DIFF" -gt 0 ]; then
            echo "Warte ${DIFF}s bis 18:00 UTC"
            sleep "$DIFF"
          else
            echo "Zielzeit bereits $(( -DIFF ))s vorbei - sofort posten"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Reel veroeffentlichen
        env:
          IG_TOKEN:   ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN:    ${{ inputs.dry_run }}
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node scripts/post.mjs

      - name: YouTube Short nachholen (manuell, optional)
        if: github.event_name == 'workflow_dispatch' && inputs.youtube_id != ''
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node scripts/youtube.mjs "${{ inputs.youtube_id }}"

      - name: Queue zurueckschreiben
        run: |
          git config user.name  "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          # Erst committen, DANN rebasen - und mit --autostash. Andersherum
          # bricht der Rebase an den frisch geschriebenen Dateien ab und der
          # Push wird verworfen: das Reel ist dann veroeffentlicht, steht in
          # der Queue aber weiter auf "ready" und wird spaeter nochmal gepostet.
          if [[ -n "$(git status --porcelain queue.json posted.json videos/)" ]]; then
            git add -A queue.json posted.json videos/
            git commit -m "posted: $(date -u +%Y-%m-%d)"
          fi
          for i in 1 2 3; do
            git pull --rebase --autostash -q && git push && break
            echo "Push-Versuch $i fehlgeschlagen, neuer Anlauf."; sleep 5
          done
          # Niemals still durchwinken: eine nicht zurueckgeschriebene Queue
          # bedeutet Doppel-Post-Gefahr beim naechsten Lauf.
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            echo "::error::Reel ist veroeffentlicht, aber die Queue konnte nicht zurueckgeschrieben werden - Gefahr eines Doppel-Posts."
            exit 1
          fi
