name: Reel produzieren

on:
  schedule:
    - cron: "0 4 * * *"      # taeglich 05:00 Berlin: nachlegen, wenn die Queue duenn wird
  workflow_dispatch:
    inputs:
      id:
        description: "Script-ID (z. B. 011) – leer = naechste offene aus ORDER.txt"
        required: false
      count:
        description: "Wie viele Reels dieser Lauf produziert (nacheinander)"
        default: "1"
      tempo:
        description: "atempo (1.0 = Original)"
        default: "1.0"
  push:
    paths:
      - "scripts/[0-9][0-9][0-9]*.json"

permissions:
  contents: write

# EIN Lauf produziert mehrere Reels nacheinander. Parallele Laeufe schreiben sonst
# alle in dieselbe queue.json: jeder "git pull --rebase" zieht die Commits der
# anderen herein, und die meisten verlieren das Rennen beim Push. Das Reel ist dann
# gerendert, steht aber nirgends. Deshalb: ein Schreiber, serielle Produktion.
concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: |
          pip install -q numpy scipy
          mkdir -p build remotion/public/audio remotion/out render
          ffmpeg -version | head -1

      - name: Remotion-Abhaengigkeiten
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Schriften bereitstellen
        working-directory: remotion
        run: |
          mkdir -p public/fonts
          for w in 500 700 800 900; do
            cp "node_modules/@fontsource/inter/files/inter-latin-$w-normal.woff2" public/fonts/
          done
          for w in 400 700; do
            cp "node_modules/@fontsource/amiri/files/amiri-arabic-$w-normal.woff2" public/fonts/
          done

      - name: Reels produzieren
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL || 'eleven_v4' }}
          ELEVEN_VOICE: ${{ vars.ELEVEN_VOICE || 'ML23UVoFL5mI6APbRAeR' }}
          VORGABE_ID: ${{ inputs.id }}
          ANZAHL: ${{ inputs.count || '1' }}
          TEMPO: ${{ inputs.tempo || '1.0' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -z "$ELEVENLABS_API_KEY" ]]; then
            echo "::error::Secret ELEVENLABS_API_KEY fehlt."; exit 1
          fi
          git config user.name  "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          N="$ANZAHL"; [[ "$N" =~ ^[0-9]+$ ]] || N=1
          # Beim Zeitplan nur nachlegen, bis wieder vier Reels in der Zukunft liegen.
          if [[ "$EVENT" == "schedule" ]]; then
            offen=$(node -e "console.log(require('./queue.json').filter(q=>q.status==='ready'&&new Date(q.publish_at)>new Date()).length)")
            echo "Queue: $offen offen"
            N=$(( 4 - offen )); [ "$N" -lt 1 ] && { echo "Queue reicht."; exit 0; }
          fi
          # Push eines Reels, mit Wiederholungen. Innerhalb EINES Laufs gibt es
          # keine Konkurrenz, die Wiederholungen fangen nur fremde Commits ab.
          sichern() {
            git add -A videos/ queue.json
            git commit -m "produced: Reel $1" || return 0
            for t in 1 2 3 4 5; do
              git pull --rebase --autostash -q && git push && return 0
              echo "Push-Versuch $t fehlgeschlagen."; sleep $(( t * 10 ))
            done
            echo "::error::Reel $1 gerendert, aber nicht gepusht."; return 1
          }
          gebaut=0; fehler=0
          for n in $(seq 1 "$N"); do
            id=""
            if [ "$n" = "1" ] && [ -n "$VORGABE_ID" ]; then
              id="$VORGABE_ID"
            elif [ "$n" = "1" ] && [ "$EVENT" = "push" ]; then
              f=$(git diff --name-only HEAD~1 HEAD -- 'scripts/[0-9][0-9][0-9]*.json' | head -1)
              [ -n "$f" ] && id=$(basename "$f" .json | cut -d- -f1)
            fi
            if [ -z "$id" ]; then
              cands=$( [ -f scripts/ORDER.txt ] && grep -oE '^[0-9]{3}' scripts/ORDER.txt || true )
              cands="$cands $(ls scripts/[0-9][0-9][0-9]*.json 2>/dev/null | xargs -n1 basename | cut -d- -f1 | sed 's/\.json$//' | sort -u)"
              for i in $cands; do
                ls scripts/$i*.json >/dev/null 2>&1 || continue
                grep -q "\"id\": \"$i\"" queue.json posted.json 2>/dev/null && continue
                id="$i"; break
              done
            fi
            if [ -z "$id" ]; then echo "Keine offenen Scripte mehr."; break; fi
            if grep -q "\"id\": \"$id\"" queue.json posted.json 2>/dev/null; then
              echo "Reel $id existiert bereits - uebersprungen."; continue
            fi
            echo "::group::Reel $id ($n von $N)"
            if ! node scripts/produce.mjs "$id"; then
              echo "::error::Voice-Over fuer $id fehlgeschlagen."; fehler=$((fehler+1)); echo "::endgroup::"; continue
            fi
            if ! bash render/make_reel.sh "$id" "build/$id-script.json" "build/$id-words.json" "build/$id-vo.mp3" 0 "$TEMPO"; then
              echo "::error::Render fuer $id fehlgeschlagen."; fehler=$((fehler+1)); echo "::endgroup::"; continue
            fi
            mp4=$(ls remotion/out/$id*-ig.mp4 2>/dev/null | head -1)
            if [ -z "$mp4" ]; then
              echo "::error::Kein Video fuer $id gefunden."; fehler=$((fehler+1)); echo "::endgroup::"; continue
            fi
            node scripts/enqueue.mjs "$id" "$mp4"
            if sichern "$id"; then gebaut=$((gebaut+1)); echo "Reel $id ist in der Queue."
            else fehler=$((fehler+1)); fi
            echo "::endgroup::"
          done
          echo "Fertig: $gebaut produziert, $fehler fehlgeschlagen."
          [ "$gebaut" -eq 0 ] && [ "$fehler" -gt 0 ] && exit 1
          exit 0

      - name: Artefakte (Debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: produce-${{ github.run_id }}
          path: |
            build/
            dashboard/produce-error.log
          retention-days: 5
