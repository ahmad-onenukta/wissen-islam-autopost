name: Reel produzieren

on:
  schedule:
    - cron: "0 4 * * *"      # taeglich 05:00 Berlin: naechstes Script produzieren, wenn Queue < 3
  workflow_dispatch:
    inputs:
      id:
        description: "Script-ID (z. B. 011) – leer = naechstes aus ORDER.txt"
        required: false
      tempo:
        description: "atempo (1.0 = Original)"
        default: "1.0"
  push:
    paths:
      - "scripts/[0-9][0-9][0-9]*.json"

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Script-ID bestimmen
        id: pick
        run: |
          id="${{ inputs.id }}"
          f=""
          if [[ -z "$id" && "${{ github.event_name }}" == "push" ]]; then
            f=$(git diff --name-only HEAD~1 HEAD -- 'scripts/[0-9][0-9][0-9]*.json' | head -1)
            [[ -n "$f" ]] && id=$(basename "$f" .json | cut -d- -f1)
          fi
          if [[ -z "$id" ]]; then
            ready=$(node -e "console.log(require('./queue.json').filter(q=>q.status==='ready'&&new Date(q.publish_at)>new Date()).length)")
            echo "Queue ready: $ready"
            if [[ "${{ github.event_name }}" == "schedule" && "$ready" -ge 3 ]]; then
              echo "Queue voll genug – nichts zu tun."; echo "id=" >> $GITHUB_OUTPUT; exit 0
            fi
            # Reihenfolge: scripts/ORDER.txt (eine ID pro Zeile), sonst aufsteigend
            cands=$( [[ -f scripts/ORDER.txt ]] && grep -oE '^[0-9]{3}' scripts/ORDER.txt || true )
            cands="$cands $(ls scripts/[0-9][0-9][0-9]*.json 2>/dev/null | xargs -n1 basename | cut -d- -f1 | sed 's/\.json$//' | sort -u)"
            for i in $cands; do
              ls scripts/$i*.json >/dev/null 2>&1 || continue
              grep -q "\"id\": \"$i\"" queue.json posted.json 2>/dev/null && continue
              id="$i"; break
            done
          fi
          [[ -z "$id" ]] && echo "Kein offenes Script."
          echo "id=$id" >> $GITHUB_OUTPUT

      - name: Schon produziert?
        id: check
        run: |
          id="${{ steps.pick.outputs.id }}"
          if [[ -z "$id" ]] || grep -q "\"id\": \"$id\"" queue.json posted.json 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT; echo "Reel $id existiert bereits oder keine ID."
          else
            echo "skip=false" >> $GITHUB_OUTPUT; echo "Produziere Reel $id"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == 'false'
        with:
          python-version: "3.12"
      - name: ffmpeg
        if: steps.check.outputs.skip == 'false'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Voice-Over + Wort-Timestamps (ElevenLabs)
        if: steps.check.outputs.skip == 'false'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_MODEL: ${{ vars.ELEVEN_MODEL || 'eleven_v4' }}
          ELEVEN_VOICE: ${{ vars.ELEVEN_VOICE || 'ML23UVoFL5mI6APbRAeR' }}
        run: |
          if [[ -z "$ELEVENLABS_API_KEY" ]]; then
            echo "::error::Secret ELEVENLABS_API_KEY fehlt – ohne Voice-Over kein Reel."; exit 1
          fi
          node scripts/produce.mjs "${{ steps.pick.outputs.id }}"

      - name: Remotion-Abhaengigkeiten
        if: steps.check.outputs.skip == 'false'
        working-directory: remotion
        run: npm install --no-audit --no-fund

      - name: Schriften bereitstellen
        if: steps.check.outputs.skip == 'false'
        working-directory: remotion
        run: |
          mkdir -p public/fonts
          for w in 500 700 800 900; do
            cp "node_modules/@fontsource/inter/files/inter-latin-$w-normal.woff2" public/fonts/
          done
          for w in 400 700; do
            cp "node_modules/@fontsource/amiri/files/amiri-arabic-$w-normal.woff2" public/fonts/
          done
          ls -la public/fonts/

      - name: Render (align -> events -> bed -> remotion -> transcode)
        if: steps.check.outputs.skip == 'false'
        env:
          REEL_ID: ${{ steps.pick.outputs.id }}
        run: |
          id="$REEL_ID"
          bash render/make_reel.sh "$id" "build/$id-script.json" "build/$id-words.json" "build/$id-vo.mp3" 0 "${{ inputs.tempo || '1.0' }}"
          ls -la remotion/out/

      - name: In Queue einreihen
        if: steps.check.outputs.skip == 'false'
        run: |
          id="${{ steps.pick.outputs.id }}"
          mp4=$(ls remotion/out/$id*-ig.mp4 | head -1)
          node scripts/enqueue.mjs "$id" "$mp4"
          git pull --rebase -q || true
          git config user.name  "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add -A videos/ queue.json
          git commit -m "produced: Reel $id"
          git push

      - name: Artefakte (Debug)
        if: always() && steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.pick.outputs.id }}
          path: |
            build/
            remotion/out/
          retention-days: 5
